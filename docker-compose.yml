services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: app/backup reach the DB over the internal docker network
    # (db:5432). Don't expose Postgres to the host/internet in production. For
    # local admin access, run `docker compose -f docker-compose.dev.yml` or
    # temporarily add a ports mapping.

  # One-shot: applies migrations (+ optional seed) with the full Prisma CLI,
  # then exits. The app waits for it to finish successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      RUN_SEED: ${RUN_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are compile-time -> bake the real site URL into the build.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOADS_DIR: /app/uploads
      UPLOADS_PUBLIC_PREFIX: /uploads
      NODE_ENV: production
      # Web Push (optional) — admin notifications when the PWA is closed.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@keereal.dev}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "3000"
    # Published on localhost only -> a HOST reverse proxy (e.g. an existing
    # system nginx serving other sites) proxies the domain to this. Not exposed
    # to the internet. Change 8090 if it clashes. In `standalone` mode the
    # bundled nginx reaches the app over the docker network instead.
    ports:
      - "127.0.0.1:8090:3000"

  # Bundled edge nginx (TLS on 80/443). ONLY for a dedicated server where these
  # ports are free. Disabled by default — enable with `--profile standalone`.
  # On a shared host that already runs nginx, leave it off and proxy from the
  # host nginx to 127.0.0.1:8090 (see deploy/keereal.dev.nginx.conf).
  nginx:
    image: nginx:1.27-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Serve uploaded files directly through nginx for performance.
      - uploads_data:/var/www/uploads:ro

  # Nightly pg_dump backups via cron.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache dcron >/dev/null 2>&1 || true
        chmod +x /usr/local/bin/backup.sh
        echo "0 3 * * * PGPASSWORD=$$POSTGRES_PASSWORD /usr/local/bin/backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        echo "Backup cron installed (daily 03:00). Running initial backup..."
        PGPASSWORD=$$POSTGRES_PASSWORD /usr/local/bin/backup.sh || true
        crond -f -l 8

volumes:
  db_data:
  uploads_data:
