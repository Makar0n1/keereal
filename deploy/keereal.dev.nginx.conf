# Server block for the HOST nginx (the one already serving your other sites).
# It proxies keereal.dev -> the app container published on 127.0.0.1:8090.
#
# Install:
#   sudo cp deploy/keereal.dev.nginx.conf /etc/nginx/sites-available/keereal.dev
#   sudo ln -s /etc/nginx/sites-available/keereal.dev /etc/nginx/sites-enabled/
#   # (or drop it into /etc/nginx/conf.d/keereal.dev.conf)
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use a Cloudflare Origin Certificate (SSL/TLS -> Origin Server). Save the
# cert + key on the host and point ssl_certificate(_key) below at them. Set the
# Cloudflare SSL/TLS mode to "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name keereal.dev www.keereal.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name keereal.dev www.keereal.dev;

    # --- Cloudflare Origin Certificate (adjust paths) ---
    ssl_certificate     /etc/ssl/keereal.dev/fullchain.pem;
    ssl_certificate_key /etc/ssl/keereal.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Live-chat SSE — no buffering, keep the connection open.
    location ~ ^/api/(admin/chat/stream|chat/stream) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
